name: Sync API spec and notra.js pins

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync
  cancel-in-progress: true

jobs:
  # The only job that sees NOTRA_REPO_TOKEN. It checks out nothing, installs
  # nothing and runs only curl and sed, so no third-party code can read the
  # token. Its outputs are the four public pin values.
  pins:
    runs-on: ubuntu-latest
    # Holds NOTRA_REPO_TOKEN; restrict this environment to the main branch so a
    # pushed branch with an edited workflow can't read it.
    environment: notra-source
    permissions: {}
    outputs:
      TRACKER_SCRIPT_VERSION: ${{ steps.pins.outputs.TRACKER_SCRIPT_VERSION }}
      TRACKER_SCRIPT_INTEGRITY: ${{ steps.pins.outputs.TRACKER_SCRIPT_INTEGRITY }}
      TRACKER_PLUS_SCRIPT_VERSION: ${{ steps.pins.outputs.TRACKER_PLUS_SCRIPT_VERSION }}
      TRACKER_PLUS_SCRIPT_INTEGRITY: ${{ steps.pins.outputs.TRACKER_PLUS_SCRIPT_INTEGRITY }}
    steps:
      - name: Read the notra.js pins from usenotra/notra
        id: pins
        env:
          GH_TOKEN: ${{ secrets.NOTRA_REPO_TOKEN }}
        run: |
          set -euo pipefail
          src="$(curl -fsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.raw+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/usenotra/notra/contents/packages/web-tracker/src/generated/script.ts?ref=main")"
          for name in TRACKER_SCRIPT_VERSION TRACKER_SCRIPT_INTEGRITY TRACKER_PLUS_SCRIPT_VERSION TRACKER_PLUS_SCRIPT_INTEGRITY; do
            value="$(printf '%s\n' "$src" | sed -nE "s/^export const $name = \"([^\"]+)\";$/\\1/p")"
            case "$name" in
              *VERSION) pattern='^[0-9a-f]{12}$' ;;
              *) pattern='^sha384-[A-Za-z0-9+/]{64}$' ;;
            esac
            if ! [[ "$value" =~ $pattern ]]; then
              echo "::error::$name is missing or malformed"
              exit 1
            fi
            echo "$name=$value" >> "$GITHUB_OUTPUT"
          done

  sync:
    needs: pins
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # No stored credential while syncing and verifying downloaded input; the
      # push step authenticates on its own.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile

      # No token here: the pins come from the pins job, and the sync checks
      # that static.usenotra.com serves exactly those bytes.
      - name: Sync
        run: bun run sync
        env:
          TRACKER_SCRIPT_VERSION: ${{ needs.pins.outputs.TRACKER_SCRIPT_VERSION }}
          TRACKER_SCRIPT_INTEGRITY: ${{ needs.pins.outputs.TRACKER_SCRIPT_INTEGRITY }}
          TRACKER_PLUS_SCRIPT_VERSION: ${{ needs.pins.outputs.TRACKER_PLUS_SCRIPT_VERSION }}
          TRACKER_PLUS_SCRIPT_INTEGRITY: ${{ needs.pins.outputs.TRACKER_PLUS_SCRIPT_INTEGRITY }}

      # A new version makes merging the PR publish it: minor for API changes,
      # patch for new notra.js pins.
      - name: Check for changes and bump the version
        id: diff
        run: |
          VERSION="$(bun scripts/bump-version.ts)"
          if [ -z "$VERSION" ]; then
            echo changed=false >> "$GITHUB_OUTPUT"
          else
            echo changed=true >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      # Pull requests opened with GITHUB_TOKEN don't trigger CI, so verify here.
      - name: Verify
        if: steps.diff.outputs.changed == 'true'
        run: |
          bun run check-types
          bun run lint
          bun run test
          bun run build

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="chore/sync-$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add spec src/generated src/tracking/script/releases.ts docs/API.md package.json src/version.ts CHANGELOG.md
          git commit -m "chore: release ${{ steps.diff.outputs.version }} with the synced API spec and notra.js pins"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
          # Only an open PR counts: a closed or merged one from earlier today needs a new PR.
          OPEN="$(gh pr list --head "$BRANCH" --state open --json number --jq length)"
          [ "$OPEN" != "0" ] || gh pr create --base main --head "$BRANCH" \
            --title "chore: release ${{ steps.diff.outputs.version }} with the synced API spec and notra.js pins" \
            --body "Daily sync from https://api.usenotra.com/openapi.json and usenotra/notra's packages/web-tracker, released as ${{ steps.diff.outputs.version }}. Merging stages the release on npm; approve it with npm stage approve. Typecheck, lint, tests and build passed in the sync run."
